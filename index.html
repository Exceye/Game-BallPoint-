<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jump Runner - Free Movement Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #87CEEB;
            transition: background-color 0.5s ease;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #buff-container {
            position: absolute;
            top: 60px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }

        .buff-badge {
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            width: max-content;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .buff-progress {
            width: 80px;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .buff-bar {
            height: 100%;
            width: 100%;
            background: #2ed573;
            transition: width 0.1s linear;
        }

        /* VIRTUAL CONTROLS UNTUK HP */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 150px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 15;
        }

        #joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 32px;
            left: 32px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        #jump-btn {
            width: 85px;
            height: 85px;
            background: rgba(46, 213, 115, 0.8);
            border: 4px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #jump-btn:active {
            background: rgba(38, 175, 95, 0.9);
            transform: scale(0.95);
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #game-over-screen p {
            font-size: 20px;
            color: white;
            margin-bottom: 25px;
        }

        #restart-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #2ed573;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #restart-btn:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="score-text">Jarak: 0 m</div>
        <div id="status-text">Waktu: Siang Hari</div>
    </div>

    <div id="buff-container"></div>

    <!-- TOUCH CONTROLS -->
    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="jump-btn">JUMP</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Jarak Tempuh: 0 m</p>
        <button id="restart-btn" onclick="resetGame()">Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score-text');
        const statusText = document.getElementById('status-text');
        const buffContainer = document.getElementById('buff-container');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');

        // Audio System
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.15);
        }

        function playBuffSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.25);
        }

        function playDashSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.35);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [400, 350, 300, 220, 150].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + i * 0.08);
                gain.gain.setValueAtTime(0.15, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.12);
            });
        }

        // Global Parameters
        let distance = 0;
        let isGameOver = false;
        let gameStarted = false;
        let groundY;
        let animTimer = 0;

        // Player State
        const player = {
            x: 100,
            y: 0,
            width: 32,
            height: 52,
            normalHeight: 52,
            crouchHeight: 28,
            vx: 0,
            vy: 0,
            speed: 5.5,
            gravity: 0.65,
            jumpForce: -13,
            isGrounded: true,
            isCrouching: false,
            facingRight: true,
            runFrame: 0
        };

        // Input Tracking
        const keys = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        // Buff System
        const activeBuffs = {
            dash: { active: false, timer: 0, maxTime: 240, color: '#00d2d3', label: '💨 DASH' },
            fly: { active: false, timer: 0, maxTime: 300, color: '#feca57', label: '🕊️ FLY' },
            jump: { active: false, timer: 0, maxTime: 360, color: '#1dd1a1', label: '🦘 SUPER JUMP' }
        };

        let luckyBlocks = [];
        let luckyBlockTimer = 0;
        let obstacles = [];
        let spawnTimer = 0;

        let clouds = [];
        let mountains = [];

        const skyColors = [
            { limit: 0, color: [135, 206, 235], label: "Siang Hari" },
            { limit: 10000, color: [243, 156, 18], label: "Sore Hari" },
            { limit: 20000, color: [44, 62, 80], label: "Malam Hari" },
            { limit: 30000, color: [20, 10, 35], label: "Gerhana Bulan" }
        ];

        function initBackground() {
            clouds = []; mountains = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4),
                    size: Math.random() * 30 + 20,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
            for (let i = 0; i < 3; i++) {
                mountains.push({
                    x: i * (canvas.width / 2) + Math.random() * 100,
                    width: canvas.width * 0.8,
                    height: canvas.height * 0.45,
                    color: '#34495e',
                    speedFactor: 0.1,
                    yOffset: 40
                });
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - 120;
            if (!gameStarted || isGameOver) {
                player.y = groundY - player.height;
            }
            initBackground();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // KEYBOARD CONTROLS (WASD & Panah)
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (!gameStarted && !isGameOver) gameStarted = true;

            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
                keys.up = true;
                doJump();
            }
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        });

        // TOUCH CONTROLS (ANALOG VIRTUAL)
        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        const jumpBtn = document.getElementById('jump-btn');

        let joyActive = false;
        let joyStartX = 0, joyStartY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            initAudio();
            if (!gameStarted && !isGameOver) gameStarted = true;
            joyActive = true;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joyStartX = rect.left + rect.width / 2;
            joyStartY = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            const touch = e.touches[0];
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (!joyActive) return;
            joyActive = false;
            joystickStick.style.left = '32px';
            joystickStick.style.top = '32px';
            keys.left = false;
            keys.right = false;
            keys.down = false;
        });

        function updateJoystick(clientX, clientY) {
            const dx = clientX - joyStartX;
            const dy = clientY - joyStartY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;

            const angle = Math.atan2(dy, dx);
            const moveX = Math.cos(angle) * Math.min(dist, maxDist);
            const moveY = Math.sin(angle) * Math.min(dist, maxDist);

            joystickStick.style.left = `${32 + moveX}px`;
            joystickStick.style.top = `${32 + moveY}px`;

            keys.left = dx < -15;
            keys.right = dx > 15;
            keys.down = dy > 20;
        }

        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            if (!gameStarted && !isGameOver) gameStarted = true;
            doJump();
        });

        function doJump() {
            if (activeBuffs.fly.active) {
                player.vy = -7;
                playJumpSound();
                return;
            }
            if (player.isGrounded && !isGameOver && gameStarted) {
                const force = activeBuffs.jump.active ? player.jumpForce * 1.45 : player.jumpForce;
                player.vy = force;
                player.isGrounded = false;
                playJumpSound();
            }
        }

        function getSkyColor(dist) {
            if (dist >= 30000) return { color: skyColors[3].color, label: skyColors[3].label };
            let startNode = skyColors[0], endNode = skyColors[1];
            for (let i = 0; i < skyColors.length - 1; i++) {
                if (dist >= skyColors[i].limit && dist < skyColors[i+1].limit) {
                    startNode = skyColors[i]; endNode = skyColors[i+1]; break;
                }
            }
            const factor = (dist - startNode.limit) / (endNode.limit - startNode.limit);
            const r = Math.round(startNode.color[0] + factor * (endNode.color[0] - startNode.color[0]));
            const g = Math.round(startNode.color[1] + factor * (endNode.color[1] - startNode.color[1]));
            const b = Math.round(startNode.color[2] + factor * (endNode.color[2] - startNode.color[2]));
            return { color: [r, g, b], label: startNode.label };
        }

        function generateLuckyBlock() {
            const heights = [groundY - 45, groundY - 95, groundY - 140];
            luckyBlocks.push({
                x: canvas.width + 50,
                y: heights[Math.floor(Math.random() * heights.length)],
                width: 36, height: 36
            });
        }

        function generateObstacle() {
            const types = ['cactus', 'box', 'bird', 'spike'];
            const chosenType = types[Math.floor(Math.random() * types.length)];
            let obstacle = { x: canvas.width + 50, type: chosenType, width: 30, height: 40, y: groundY - 40 };

            if (chosenType === 'cactus') {
                obstacle.width = 30; obstacle.height = Math.random() * 15 + 40;
                obstacle.y = groundY - obstacle.height;
            } else if (chosenType === 'box') {
                obstacle.width = 36; obstacle.height = 36; obstacle.y = groundY - 36;
            } else if (chosenType === 'bird') {
                obstacle.width = 42; obstacle.height = 26; obstacle.y = groundY - 80;
            } else if (chosenType === 'spike') {
                obstacle.width = 40; obstacle.height = 28; obstacle.y = groundY - 28;
            }
            obstacles.push(obstacle);
        }

        function triggerRandomBuff() {
            const buffTypes = ['dash', 'fly', 'jump', 'score'];
            const chosen = buffTypes[Math.floor(Math.random() * buffTypes.length)];
            if (chosen === 'score') {
                distance += 500; playBuffSound();
            } else if (chosen === 'dash') {
                activeBuffs.dash.active = true; activeBuffs.dash.timer = activeBuffs.dash.maxTime; playDashSound();
            } else if (chosen === 'fly') {
                activeBuffs.fly.active = true; activeBuffs.fly.timer = activeBuffs.fly.maxTime; player.vy = -6; playBuffSound();
            } else if (chosen === 'jump') {
                activeBuffs.jump.active = true; activeBuffs.jump.timer = activeBuffs.jump.maxTime; playBuffSound();
            }
        }

        function checkCollision(p, obs) {
            const padding = 4;
            return (
                p.x + padding < obs.x + obs.width &&
                p.x + p.width - padding > obs.x &&
                p.y + padding < obs.y + obs.height &&
                p.y + p.height - padding > obs.y
            );
        }

        function updateUIBuffs() {
            buffContainer.innerHTML = '';
            Object.keys(activeBuffs).forEach(key => {
                const b = activeBuffs[key];
                if (b.active) {
                    const pct = (b.timer / b.maxTime) * 100;
                    const badge = document.createElement('div');
                    badge.className = 'buff-badge';
                    badge.style.borderColor = b.color;
                    badge.innerHTML = `
                        <span>${b.label}</span>
                        <div class="buff-progress"><div class="buff-bar" style="width: ${pct}%; background: ${b.color};"></div></div>
                    `;
                    buffContainer.appendChild(badge);
                }
            });
        }

        function update() {
            if (!gameStarted || isGameOver) return;
            animTimer++;

            // Update Buff Timers
            Object.keys(activeBuffs).forEach(k => {
                if (activeBuffs[k].active) {
                    activeBuffs[k].timer--;
                    if (activeBuffs[k].timer <= 0) activeBuffs[k].active = false;
                }
            });
            updateUIBuffs();

            // Handle Crouch Status
            if (keys.down && player.isGrounded) {
                player.isCrouching = true;
                player.height = player.crouchHeight;
            } else {
                player.isCrouching = false;
                player.height = player.normalHeight;
            }

            // Movement Input Horizontal
            let speedMult = activeBuffs.dash.active ? 2.2 : 1.0;
            let currentSpeed = player.speed * speedMult;

            player.vx = 0;
            if (keys.right) {
                player.vx = currentSpeed;
                player.facingRight = true;
            }
            if (keys.left) {
                player.vx = -currentSpeed;
                player.facingRight = false;
            }

            // Menerapkan Posisi X
            player.x += player.vx;
            if (player.x < 20) player.x = 20;
            if (player.x > canvas.width - 100) player.x = canvas.width - 100;

            // Update Jarak Tempuh jika bergerak ke kanan
            if (keys.right || activeBuffs.dash.active) {
                distance += Math.round(currentSpeed);
            }

            // Movement Input Vertikal & Fisika
            if (activeBuffs.fly.active) {
                player.vy += 0.25;
                player.y += player.vy;
                if (player.y < 50) player.y = 50;
                if (player.y + player.height >= groundY) {
                    player.y = groundY - player.height;
                    player.vy = 0; player.isGrounded = true;
                } else {
                    player.isGrounded = false;
                }
            } else {
                const grav = activeBuffs.jump.active ? player.gravity * 0.75 : player.gravity;
                player.vy += grav;
                player.y += player.vy;
                if (player.y + player.height >= groundY) {
                    player.y = groundY - player.height;
                    player.vy = 0; player.isGrounded = true;
                }
            }

            if (player.isGrounded && player.vx !== 0 && animTimer % 6 === 0) {
                player.runFrame = (player.runFrame + 1) % 4;
            }

            // Laju Rintangan Bergeser
            let worldSpeed = 3 + (distance / 4000);
            if (activeBuffs.dash.active) worldSpeed *= 2.5;

            // Parallax
            clouds.forEach(c => {
                c.x -= c.speed + (worldSpeed * 0.05);
                if (c.x + c.size * 3 < 0) c.x = canvas.width + c.size * 3;
            });

            // Spawn Lucky Blocks
            luckyBlockTimer++;
            if (luckyBlockTimer > 300 + Math.random() * 200) {
                generateLuckyBlock();
                luckyBlockTimer = 0;
            }

            for (let i = luckyBlocks.length - 1; i >= 0; i--) {
                const lb = luckyBlocks[i];
                lb.x -= worldSpeed;
                if (checkCollision(player, lb)) {
                    triggerRandomBuff();
                    luckyBlocks.splice(i, 1);
                    continue;
                }
                if (lb.x + lb.width < 0) luckyBlocks.splice(i, 1);
            }

            // Spawn Rintangan
            spawnTimer++;
            const minInterval = Math.max(60, 110 - Math.floor(distance / 500));
            if (spawnTimer > minInterval + Math.random() * 30) {
                generateObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= worldSpeed;

                if (checkCollision(player, obs)) {
                    if (activeBuffs.dash.active) {
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        triggerGameOver();
                    }
                }
                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            // UI
            scoreText.innerText = `Jarak: ${distance} m`;
            const skyInfo = getSkyColor(distance);
            canvas.style.backgroundColor = `rgb(${skyInfo.color[0]}, ${skyInfo.color[1]}, ${skyInfo.color[2]})`;
            statusText.innerText = `Waktu: ${skyInfo.label}`;
        }

        function drawLuckyBlocks() {
            luckyBlocks.forEach(lb => {
                ctx.save();
                const floatY = Math.sin(animTimer * 0.1) * 4;
                const drawY = lb.y + floatY;
                ctx.shadowBlur = 12; ctx.shadowColor = '#f1c40f';
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(lb.x, drawY, lb.width, lb.height);
                ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(lb.x, drawY, lb.width, lb.height);
                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('?', lb.x + lb.width / 2, drawY + lb.height / 2 + 1);
                ctx.restore();
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            if (!player.facingRight) ctx.scale(-1, 1);

            const drawX = -player.width / 2;
            const drawY = -player.height / 2;

            // Aura Buff
            if (activeBuffs.dash.active) {
                ctx.fillStyle = 'rgba(0, 210, 211, 0.4)';
                ctx.fillRect(drawX - 25, drawY, player.width, player.height);
                ctx.shadowBlur = 20; ctx.shadowColor = '#00d2d3';
            } else if (activeBuffs.fly.active) {
                ctx.shadowBlur = 20; ctx.shadowColor = '#feca57';
                ctx.fillStyle = 'rgba(254, 202, 87, 0.8)';
                ctx.beginPath();
                ctx.moveTo(drawX + 8, drawY + 15);
                ctx.lineTo(drawX - 20, drawY + (animTimer % 10 < 5 ? 5 : 25));
                ctx.lineTo(drawX + 8, drawY + 25);
                ctx.fill();
            } else if (activeBuffs.jump.active) {
                ctx.shadowBlur = 15; ctx.shadowColor = '#1dd1a1';
            }

            if (player.isCrouching) {
                // Gambar Karakter Menunduk
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(drawX + 22, drawY + 10, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2e86de';
                ctx.fillRect(drawX + 4, drawY + 12, 20, 14);
            } else {
                // Gambar Karakter Normal
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(drawX + 16, drawY + 10, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(drawX + 20, drawY + 8, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = activeBuffs.dash.active ? '#00d2d3' : '#2e86de';
                ctx.fillRect(drawX + 8, drawY + 20, 16, 18);

                ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                if (!player.isGrounded) {
                    ctx.beginPath();
                    ctx.moveTo(drawX + 12, drawY + 38); ctx.lineTo(drawX + 4, drawY + 46);
                    ctx.moveTo(drawX + 20, drawY + 38); ctx.lineTo(drawX + 26, drawY + 50);
                    ctx.stroke();
                } else {
                    const legCycles = [{ l1: -8, r1: 8 }, { l1: 0, r1: 0 }, { l1: 8, r1: -8 }, { l1: 0, r1: 0 }];
                    const c = legCycles[player.runFrame];
                    ctx.beginPath();
                    ctx.moveTo(drawX + 12, drawY + 38); ctx.lineTo(drawX + 12 + c.l1, drawY + 52);
                    ctx.moveTo(drawX + 20, drawY + 38); ctx.lineTo(drawX + 20 + c.r1, drawY + 52);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.save();
                ctx.lineWidth = 3; ctx.strokeStyle = '#000000';

                if (obs.type === 'cactus') {
                    ctx.fillStyle = '#00ff66';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'box') {
                    ctx.fillStyle = '#ffb142';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'bird') {
                    ctx.fillStyle = '#ffda79';
                    ctx.beginPath();
                    ctx.ellipse(obs.x + 20, obs.y + 13, 18, 10, 0, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                } else if (obs.type === 'spike') {
                    ctx.fillStyle = '#ff4d4d';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Awan & Gunung
            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2); ctx.fill();
            });

            // Tanah
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // Render Elemen
            drawLuckyBlocks();
            drawPlayer();
            drawObstacles();

            if (!gameStarted && !isGameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Gunakan Analog / WASD / Panah untuk Bergerak', canvas.width / 2, canvas.height / 2 - 20);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            playGameOverSound();
            finalScoreText.innerText = `Jarak Tempuh: ${distance} m`;
            gameOverScreen.classList.add('active');
        }

        function resetGame() {
            initAudio();
            distance = 0;
            obstacles = [];
            luckyBlocks = [];
            spawnTimer = 0;
            luckyBlockTimer = 0;

            Object.keys(activeBuffs).forEach(k => {
                activeBuffs[k].active = false;
                activeBuffs[k].timer = 0;
            });

            player.x = 100;
            player.y = groundY - player.height;
            player.vy = 0;
            player.isGrounded = true;

            isGameOver = false;
            gameStarted = true;
            gameOverScreen.classList.remove('active');
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
