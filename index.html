<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Style Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c94fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        #buff-container {
            position: absolute;
            top: 60px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }

        .buff-badge {
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            width: max-content;
        }

        .buff-progress {
            width: 80px;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .buff-bar {
            height: 100%;
            width: 100%;
            background: #2ed573;
            transition: width 0.1s linear;
        }

        /* CONTROLS HP */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 15;
        }

        #joystick-zone {
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-stick {
            width: 46px;
            height: 46px;
            background: #e74c3c;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 29px;
            left: 29px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        #jump-btn {
            width: 80px;
            height: 80px;
            background: #2ecc71;
            border: 4px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px #000;
        }

        #jump-btn:active {
            background: #27ae60;
            transform: scale(0.92);
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            font-size: 52px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }

        #game-over-screen p {
            font-size: 22px;
            color: white;
            margin-bottom: 25px;
            text-shadow: 1px 1px 0px #000;
        }

        #restart-btn {
            padding: 14px 36px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #2ecc71;
            border: 3px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #restart-btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="score-text">Dunia: 0 m</div>
        <div id="status-text">MARIO STYLE</div>
    </div>

    <div id="buff-container"></div>

    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="jump-btn">JUMP</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Jarak Tempuh: 0 m</p>
        <button id="restart-btn" id="btn-restart" blur>Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score-text');
        const buffContainer = document.getElementById('buff-container');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Audio System
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.15);
        }

        function playHitBlockSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(500, now + 0.08);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.2);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [300, 260, 220, 150].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + i * 0.12);
                gain.gain.setValueAtTime(0.2, now + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.14);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.15);
            });
        }

        // Global Game States
        let isGameOver = false;
        let groundY;
        let cameraX = 0;
        let maxReachedX = 0;

        // Player Attributes
        const player = {
            x: 100,
            y: 0,
            width: 36,
            height: 52,
            normalHeight: 52,
            crouchHeight: 30,
            vx: 0,
            vy: 0,
            speed: 5.5,
            gravity: 0.65,
            jumpForce: -13.5,
            isGrounded: false,
            isCrouching: false,
            facingRight: true,
            animFrame: 0
        };

        const keys = { left: false, right: false, up: false, down: false };

        // Buff System
        const activeBuffs = {
            dash: { active: false, timer: 0, maxTime: 250, color: '#00d2d3', label: '💨 SPEED' },
            jump: { active: false, timer: 0, maxTime: 350, color: '#1dd1a1', label: '🦘 HIGH JUMP' }
        };

        // World Objects (Mario Style)
        let hills = [];
        let clouds = [];
        let blocks = [];
        let pipes = [];
        let enemies = [];

        function generateWorld() {
            hills = []; clouds = []; blocks = []; pipes = []; enemies = [];

            // Background Hills (Gunung Khas Mario)
            for (let i = -500; i < 20000; i += 400 + Math.random() * 300) {
                hills.push({ x: i, width: 220 + Math.random() * 100, height: 100 + Math.random() * 60 });
            }

            // Clouds
            for (let i = -500; i < 20000; i += 250 + Math.random() * 200) {
                clouds.push({ x: i, y: 50 + Math.random() * 120, size: 30 + Math.random() * 20 });
            }

            // Procedural Level Generation
            let currentX = 500;
            while (currentX < 20000) {
                const choice = Math.random();

                if (choice < 0.4) {
                    // Blok Bertingkat / Q-Blocks
                    const count = Math.floor(Math.random() * 4) + 2;
                    const blockY = groundY - 110 - (Math.random() > 0.5 ? 60 : 0);
                    for (let b = 0; b < count; b++) {
                        const isQuestion = (b === 1 || Math.random() < 0.3);
                        blocks.push({
                            x: currentX + (b * 40),
                            y: blockY,
                            width: 38,
                            height: 38,
                            type: isQuestion ? 'question' : 'brick',
                            hit: false
                        });
                    }
                    currentX += count * 40 + 150;
                } else if (choice < 0.7) {
                    // Pipa Hijau
                    const pipeHeight = 50 + Math.floor(Math.random() * 3) * 25;
                    pipes.push({
                        x: currentX,
                        y: groundY - pipeHeight,
                        width: 52,
                        height: pipeHeight
                    });

                    // Kadang ada musuh dekat pipa
                    if (Math.random() < 0.5) {
                        enemies.push({
                            x: currentX + 120,
                            y: groundY - 32,
                            width: 32,
                            height: 32,
                            vx: -1.5,
                            minX: currentX + 60,
                            maxX: currentX + 250
                        });
                    }
                    currentX += 280;
                } else {
                    currentX += 200;
                }
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - 90;
            if (player.y === 0) player.y = groundY - player.height;
            generateWorld();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // FIX BUG SPASI - MEMATIKAN DEFAULT BROWSER BEHAVIOR
        window.addEventListener('keydown', (e) => {
            initAudio();
            // Cegah Halaman Scroll / Trigger Tombol Fokus saat tekan Spasi / Panah
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }

            if (isGameOver) return;

            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
                keys.up = true;
                doJump();
            }
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        }, { passive: false });

        window.addEventListener('keyup', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.down = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
        }, { passive: false });

        // Touch Control Joystick
        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        const jumpBtn = document.getElementById('jump-btn');

        let joyActive = false;
        let joyStartX = 0, joyStartY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            joyActive = true;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joyStartX = rect.left + rect.width / 2;
            joyStartY = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            const touch = e.touches[0];
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (!joyActive) return;
            joyActive = false;
            joystickStick.style.left = '29px';
            joystickStick.style.top = '29px';
            keys.left = false; keys.right = false; keys.down = false;
        });

        function updateJoystick(clientX, clientY) {
            const dx = clientX - joyStartX;
            const dy = clientY - joyStartY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 35;

            const angle = Math.atan2(dy, dx);
            const moveX = Math.cos(angle) * Math.min(dist, maxDist);
            const moveY = Math.sin(angle) * Math.min(dist, maxDist);

            joystickStick.style.left = `${29 + moveX}px`;
            joystickStick.style.top = `${29 + moveY}px`;

            keys.left = dx < -12;
            keys.right = dx > 12;
            keys.down = dy > 18;
        }

        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            doJump();
        }, { passive: false });

        function doJump() {
            if (player.isGrounded && !isGameOver) {
                const force = activeBuffs.jump.active ? player.jumpForce * 1.35 : player.jumpForce;
                player.vy = force;
                player.isGrounded = false;
                playJumpSound();
            }
        }

        restartBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetGame();
            restartBtn.blur(); // Hilangkan fokus agar pencetan Spasi selanjutnya tidak memicu tombol lagi
        });

        function triggerRandomBuff() {
            if (Math.random() > 0.5) {
                activeBuffs.dash.active = true; activeBuffs.dash.timer = activeBuffs.dash.maxTime;
            } else {
                activeBuffs.jump.active = true; activeBuffs.jump.timer = activeBuffs.jump.maxTime;
            }
        }

        function checkAABB(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        function updateUIBuffs() {
            buffContainer.innerHTML = '';
            Object.keys(activeBuffs).forEach(key => {
                const b = activeBuffs[key];
                if (b.active) {
                    const pct = (b.timer / b.maxTime) * 100;
                    const badge = document.createElement('div');
                    badge.className = 'buff-badge';
                    badge.style.borderColor = b.color;
                    badge.innerHTML = `
                        <span>${b.label}</span>
                        <div class="buff-progress"><div class="buff-bar" style="width: ${pct}%; background: ${b.color};"></div></div>
                    `;
                    buffContainer.appendChild(badge);
                }
            });
        }

        function update() {
            if (isGameOver) return;

            // Buff Timers
            Object.keys(activeBuffs).forEach(k => {
                if (activeBuffs[k].active) {
                    activeBuffs[k].timer--;
                    if (activeBuffs[k].timer <= 0) activeBuffs[k].active = false;
                }
            });
            updateUIBuffs();

            // Crouch
            if (keys.down && player.isGrounded) {
                player.isCrouching = true;
                player.height = player.crouchHeight;
            } else {
                player.isCrouching = false;
                player.height = player.normalHeight;
            }

            // Horisontal Movement
            let moveSpeed = activeBuffs.dash.active ? player.speed * 1.8 : player.speed;
            player.vx = 0;
            if (keys.right) { player.vx = moveSpeed; player.facingRight = true; }
            if (keys.left) { player.vx = -moveSpeed; player.facingRight = false; }

            player.x += player.vx;
            if (player.x < 0) player.x = 0;

            // Update Max Distance
            if (player.x > maxReachedX) {
                maxReachedX = player.x;
            }
            scoreText.innerText = `Dunia: ${Math.floor(maxReachedX / 10)} m`;

            // Kamera Bergerak Ikut Karakter (Kamera Centering)
            cameraX = player.x - canvas.width * 0.35;
            if (cameraX < 0) cameraX = 0;

            // Gravitasi & Vertikal
            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;

            // Kolisi Tanah
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Kolisi Pipa
            pipes.forEach(pipe => {
                if (checkAABB(player, pipe)) {
                    // Datang dari atas pipa
                    if (player.vy > 0 && player.y + player.height - player.vy <= pipe.y + 12) {
                        player.y = pipe.y - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    } 
                    // Samping Kiri/Kanan
                    else if (player.vx > 0 && player.x + player.width - player.vx <= pipe.x) {
                        player.x = pipe.x - player.width;
                    } else if (player.vx < 0 && player.x - player.vx >= pipe.x + pipe.width) {
                        player.x = pipe.x + pipe.width;
                    }
                }
            });

            // Kolisi Blok
            blocks.forEach(b => {
                if (checkAABB(player, b)) {
                    // Lompat Menyundul Blok dari Bawah
                    if (player.vy < 0 && player.y - player.vy >= b.y + b.height - 10) {
                        player.y = b.y + b.height;
                        player.vy = 0;
                        if (b.type === 'question' && !b.hit) {
                            b.hit = true;
                            triggerRandomBuff();
                            playHitBlockSound();
                        } else {
                            playHitBlockSound();
                        }
                    }
                    // Mendarat di Atas Blok
                    else if (player.vy > 0 && player.y + player.height - player.vy <= b.y + 10) {
                        player.y = b.y - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    }
                    // Samping
                    else if (player.vx > 0 && player.x + player.width - player.vx <= b.x) {
                        player.x = b.x - player.width;
                    } else if (player.vx < 0 && player.x - player.vx >= b.x + b.width) {
                        player.x = b.x + b.width;
                    }
                }
            });

            // Musuh (Goomba Style)
            enemies.forEach(e => {
                e.x += e.vx;
                if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;

                if (checkAABB(player, e)) {
                    // Injak Musuh dari Atas
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
                        player.vy = -9;
                        playHitBlockSound();
                        e.x = -9999; // Hapus musuh
                    } else {
                        triggerGameOver();
                    }
                }
            });
        }

        // DRAWING FUNCTIONS (Seni Kartun ala Mario)
        function drawHills() {
            hills.forEach(h => {
                const screenX = h.x - cameraX * 0.4; // Parallax Effect
                if (screenX + h.width > -100 && screenX < canvas.width + 100) {
                    ctx.save();
                    ctx.fillStyle = '#00a800';
                    ctx.beginPath();
                    ctx.ellipse(screenX + h.width / 2, groundY, h.width / 2, h.height, 0, Math.PI, 0);
                    ctx.fill();
                    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
                    ctx.restore();
                }
            });
        }

        function drawClouds() {
            ctx.fillStyle = '#ffffff';
            clouds.forEach(c => {
                const screenX = c.x - cameraX * 0.2; // Parallax slow
                if (screenX + 100 > 0 && screenX < canvas.width + 100) {
                    ctx.beginPath();
                    ctx.arc(screenX, c.y, c.size, 0, Math.PI * 2);
                    ctx.arc(screenX + c.size * 0.7, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI * 2);
                    ctx.arc(screenX + c.size * 1.4, c.y, c.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawBlocks() {
            blocks.forEach(b => {
                const screenX = b.x - cameraX;
                if (screenX + b.width > 0 && screenX < canvas.width) {
                    ctx.save();
                    if (b.type === 'question') {
                        ctx.fillStyle = b.hit ? '#8d6e63' : '#f39c12';
                        ctx.fillRect(screenX, b.y, b.width, b.height);
                        ctx.lineWidth = 3; ctx.strokeStyle = '#000';
                        ctx.strokeRect(screenX, b.y, b.width, b.height);

                        if (!b.hit) {
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 22px sans-serif';
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText('?', screenX + b.width / 2, b.y + b.height / 2);
                        }
                    } else {
                        // Brick
                        ctx.fillStyle = '#d35400';
                        ctx.fillRect(screenX, b.y, b.width, b.height);
                        ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                        ctx.strokeRect(screenX, b.y, b.width, b.height);
                    }
                    ctx.restore();
                }
            });
        }

        function drawPipes() {
            pipes.forEach(p => {
                const screenX = p.x - cameraX;
                if (screenX + p.width > 0 && screenX < canvas.width) {
                    ctx.save();
                    // Badan Pipa
                    ctx.fillStyle = '#27ae60';
                    ctx.fillRect(screenX + 4, p.y + 12, p.width - 8, p.height - 12);
                    ctx.strokeRect(screenX + 4, p.y + 12, p.width - 8, p.height - 12);
                    // Kepala Pipa
                    ctx.fillRect(screenX, p.y, p.width, 16);
                    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
                    ctx.strokeRect(screenX, p.y, p.width, 16);
                    ctx.restore();
                }
            });
        }

        function drawEnemies() {
            enemies.forEach(e => {
                const screenX = e.x - cameraX;
                if (screenX + e.width > 0 && screenX < canvas.width) {
                    ctx.save();
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.arc(screenX + e.width / 2, e.y + e.height / 2, e.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
                    // Mata Musuh
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(screenX + 6, e.y + 8, 6, 8);
                    ctx.fillRect(screenX + 20, e.y + 8, 6, 8);
                    ctx.restore();
                }
            });
        }

        function drawPlayer() {
            const screenX = player.x - cameraX;
            ctx.save();
            ctx.translate(screenX + player.width / 2, player.y + player.height / 2);
            if (!player.facingRight) ctx.scale(-1, 1);

            const drawX = -player.width / 2;
            const drawY = -player.height / 2;

            if (player.isCrouching) {
                // Topi / Kepala
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(drawX + 22, drawY + 12, 10, 0, Math.PI * 2); ctx.fill();
                // Baju
                ctx.fillStyle = '#2980b9';
                ctx.fillRect(drawX + 6, drawY + 14, 22, 16);
            } else {
                // Topi Merah
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(drawX + 18, drawY + 12, 11, 0, Math.PI * 2); ctx.fill();
                // Muka
                ctx.fillStyle = '#ffdda1';
                ctx.beginPath(); ctx.arc(drawX + 22, drawY + 14, 5, 0, Math.PI * 2); ctx.fill();
                // Baju Biru
                ctx.fillStyle = activeBuffs.dash.active ? '#f1c40f' : '#2980b9';
                ctx.fillRect(drawX + 8, drawY + 22, 20, 18);
                // Kaki
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(drawX + 6, drawY + 40, 10, 12);
                ctx.fillRect(drawX + 20, drawY + 40, 10, 12);
            }

            ctx.restore();
        }

        function draw() {
            // Sky
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render World
            drawClouds();
            drawHills();

            // Ground
            ctx.fillStyle = '#c0392b'; // Coklat Bata
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#27ae60'; // Rumput
            ctx.fillRect(0, groundY, canvas.width, 16);
            ctx.lineWidth = 3; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // Objects
            drawPipes();
            drawBlocks();
            drawEnemies();
            drawPlayer();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            playGameOverSound();
            finalScoreText.innerText = `Jarak Tempuh: ${Math.floor(maxReachedX / 10)} m`;
            gameOverScreen.classList.add('active');
        }

        function resetGame() {
            initAudio();
            maxReachedX = 0;
            cameraX = 0;
            player.x = 100;
            player.y = groundY - player.height;
            player.vy = 0;
            player.isGrounded = true;

            Object.keys(activeBuffs).forEach(k => { activeBuffs[k].active = false; });
            generateWorld();

            isGameOver = false;
            gameOverScreen.classList.remove('active');
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
