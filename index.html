<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jump Ball Game - Enhanced</title>
    <style>
        /* Reset gaya dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        /* Kanvas Full Screen */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #87CEEB; /* Warna langit siang awal */
            transition: background-color 0.5s ease;
        }

        /* UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 10;
        }

        /* Game Over Screen */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #game-over-screen p {
            font-size: 20px;
            color: white;
            margin-bottom: 25px;
        }

        /* Tombol Restart */
        #restart-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #2ed573;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        #restart-btn:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="score-text">Jarak: 0 m</div>
        <div id="status-text">Waktu: Siang Hari</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Jarak Tempuh: 0 m</p>
        <button id="restart-btn" onclick="resetGame()">Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score-text');
        const statusText = document.getElementById('status-text');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');

        // Parameter Utama Game
        let distance = 0;
        let baseSpeed = 6;
        let currentSpeed = baseSpeed;
        let isGameOver = false;
        let gameStarted = false;
        let animationFrameId;
        let groundY;

        // Karakter Bola
        const ball = {
            x: 50,
            y: 0,
            radius: 20,
            color: '#ff4757',
            dy: 0,
            gravity: 0.6,
            jumpForce: -12,
            isGrounded: true
        };

        let obstacles = [];
        let spawnTimer = 0;

        // Elemen Latar Belakang (Awan & Gunung)
        let clouds = [];
        let mountains = [];

        // Tema Waktu Langit
        const skyColors = [
            { limit: 0, color: [135, 206, 235], label: "Siang Hari" },
            { limit: 10000, color: [243, 156, 18], label: "Sore Hari" },
            { limit: 20000, color: [44, 62, 80], label: "Malam Hari" },
            { limit: 30000, color: [20, 10, 35], label: "Gerhana Bulan" }
        ];

        // Inisialisasi Latar Belakang
        function initBackground() {
            clouds = [];
            mountains = [];
            
            // Buat awan awal
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4),
                    size: Math.random() * 30 + 20,
                    speed: Math.random() * 0.5 + 0.2
                });
            }

            // Buat gunung awal (lapisan jauh dan dekat)
            // Lapisan jauh (lebih gelap, lebih lambat)
            for (let i = 0; i < 3; i++) {
                mountains.push({
                    x: i * (canvas.width / 2) + Math.random() * 100,
                    width: canvas.width * 0.8,
                    height: canvas.height * 0.5,
                    color: '#4a5568', // Slate gray
                    speedFactor: 0.1,
                    yOffset: 50 // Sedikit di atas tanah
                });
            }
            // Lapisan dekat (lebih terang, lebih cepat)
            for (let i = 0; i < 2; i++) {
                mountains.push({
                    x: i * (canvas.width) + Math.random() * 200,
                    width: canvas.width * 1.2,
                    height: canvas.height * 0.3,
                    color: '#718096', // Light slate gray
                    speedFactor: 0.3,
                    yOffset: 0 // Pas di tanah
                });
            }
        }

        // Responsivitas Kanvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - 120;
            
            // Posisikan bola ke tanah
            if (!gameStarted || isGameOver) {
                ball.x = Math.min(100, canvas.width * 0.15);
                ball.y = groundY - ball.radius;
            }

            initBackground(); // Re-inisialisasi latar saat resize
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Kontrol Lompat & Mulai Game
        function handleInput(e) {
            if (e && e.target && e.target.tagName === 'BUTTON') return; 

            if (!gameStarted && !isGameOver) {
                gameStarted = true;
            }

            if (ball.isGrounded && !isGameOver && gameStarted) {
                ball.dy = ball.jumpForce;
                ball.isGrounded = false;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON') e.preventDefault();
            handleInput(e);
        }, { passive: false });

        window.addEventListener('mousedown', handleInput);

        // Hitung Warna Langit berdasarkan Jarak
        function getSkyColor(dist) {
            if (dist >= 30000) return { color: skyColors[3].color, label: skyColors[3].label };

            let startNode = skyColors[0];
            let endNode = skyColors[1];

            for (let i = 0; i < skyColors.length - 1; i++) {
                if (dist >= skyColors[i].limit && dist < skyColors[i+1].limit) {
                    startNode = skyColors[i];
                    endNode = skyColors[i+1];
                    break;
                }
            }

            const factor = (dist - startNode.limit) / (endNode.limit - startNode.limit);
            const r = Math.round(startNode.color[0] + factor * (endNode.color[0] - startNode.color[0]));
            const g = Math.round(startNode.color[1] + factor * (endNode.color[1] - startNode.color[1]));
            const b = Math.round(startNode.color[2] + factor * (endNode.color[2] - startNode.color[2]));

            return { color: [r, g, b], label: startNode.label };
        }

        // Generate Rintangan Segitiga
        function generateObstacle() {
            const isEclipse = distance >= 30000;
            let width, height;

            if (isEclipse) {
                width = Math.random() * 30 + 20;
                height = Math.random() * 50 + 30;
            } else {
                const sizes = [
                    { w: 25, h: 30 },
                    { w: 35, h: 45 },
                    { w: 45, h: 60 }
                ];
                const selected = sizes[Math.floor(Math.random() * sizes.length)];
                width = selected.w;
                height = selected.h;
            }

            obstacles.push({
                x: canvas.width + 50,
                width: width,
                height: height
            });
        }

        // Cek Tabrakan (Lingkaran vs Segitiga sederhana)
        function checkCollision(ball, tri) {
            const closestX = Math.max(tri.x, Math.min(ball.x, tri.x + tri.width));
            const closestY = Math.max(groundY - tri.height, Math.min(ball.y, groundY));
            const distX = ball.x - closestX;
            const distY = ball.y - closestY;
            return (distX * distX) + (distY * distY) < (ball.radius * ball.radius);
        }

        // Update Logika Game
        function update() {
            if (!gameStarted || isGameOver) return;

            distance += Math.round(currentSpeed / 2);

            // Tingkatkan Kecepatan
            if (distance >= 30000) {
                currentSpeed = 15;
            } else {
                currentSpeed = baseSpeed + (distance / 3500);
            }

            // Fisika Bola
            ball.dy += ball.gravity;
            ball.y += ball.dy;

            if (ball.y + ball.radius >= groundY) {
                ball.y = groundY - ball.radius;
                ball.dy = 0;
                ball.isGrounded = true;
            }

            // Gerakkan Latar Belakang (Parallax)
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed + (currentSpeed * 0.05); // Sedikit terpengaruh kec. game
                if (cloud.x + cloud.size * 3 < 0) {
                    cloud.x = canvas.width + cloud.size * 3;
                    cloud.y = Math.random() * (canvas.height * 0.4);
                }
            });

            mountains.forEach(mountain => {
                mountain.x -= currentSpeed * mountain.speedFactor;
                if (mountain.x + mountain.width < 0) {
                    mountain.x = canvas.width;
                }
            });

            // Spawn Rintangan
            spawnTimer++;
            const isEclipse = distance >= 30000;
            const minInterval = isEclipse ? 45 : Math.max(60, 120 - Math.floor(distance / 400));
            const randomVar = isEclipse ? Math.random() * 40 : Math.random() * 30;

            if (spawnTimer > minInterval + randomVar) {
                generateObstacle();
                spawnTimer = 0;
            }

            // Update Rintangan & Cek Tabrakan
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= currentSpeed;

                if (checkCollision(ball, obs)) {
                    triggerGameOver();
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Update UI
            scoreText.innerText = `Jarak: ${distance} m`;
            const skyInfo = getSkyColor(distance);
            canvas.style.backgroundColor = `rgb(${skyInfo.color[0]}, ${skyInfo.color[1]}, ${skyInfo.color[2]})`;
            statusText.innerText = `Waktu: ${skyInfo.label}`;
        }

        // Gambar Elemen Visual
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Matahari atau Bulan (Responsif)
            const sunX = canvas.width - Math.min(100, canvas.width * 0.1);
            const sunY = 80;

            if (distance >= 30000) {
                // Bulan Gerhana
                ctx.beginPath();
                ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
                ctx.fillStyle = '#ff3300';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff3300';
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(sunX - 10, sunY - 5, 35, 0, Math.PI * 2);
                ctx.fillStyle = getComputedStyle(canvas).backgroundColor; // Warna sama dg langit
                ctx.fill();
            } else {
                // Matahari
                ctx.beginPath();
                ctx.arc(sunX, sunY, 35, 0, Math.PI * 2);
                const sunColor = distance > 8000 ? '#e67e22' : '#f1c40f'; // Lebih oranye saat sore
                ctx.fillStyle = sunColor;
                ctx.shadowBlur = distance > 8000 ? 25 : 15;
                ctx.shadowColor = distance > 8000 ? '#d35400' : '#f39c12';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Gambar Awan
            ctx.fillStyle = distance > 15000 ? 'rgba(200, 200, 200, 0.8)' : 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.6, cloud.y - cloud.size * 0.4, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.2, cloud.y, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });

            // Gambar Gunung (Latar Belakang)
            mountains.forEach(mtn => {
                ctx.fillStyle = mtn.color;
                // Gelapkan gunung saat malam/gerhana
                if (distance > 18000) {
                     ctx.fillStyle = '#1a202c'; // Sangat gelap
                }
                ctx.beginPath();
                ctx.moveTo(mtn.x, groundY - mtn.yOffset);
                ctx.lineTo(mtn.x + mtn.width / 2, groundY - mtn.height - mtn.yOffset);
                ctx.lineTo(mtn.x + mtn.width, groundY - mtn.yOffset);
                ctx.closePath();
                ctx.fill();
            });

            // Gambar Tanah
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            ctx.strokeStyle = '#636e72';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Gambar Bola
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();

            // Gambar Rintangan
            ctx.fillStyle = '#d63031';
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.moveTo(obs.x, groundY);
                ctx.lineTo(obs.x + (obs.width / 2), groundY - obs.height);
                ctx.lineTo(obs.x + obs.width, groundY);
                ctx.closePath();
                ctx.fill();
            });

            // Tulisan Standby
            if (!gameStarted && !isGameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Ketuk Layar atau Spasi untuk Mulai', canvas.width / 2, canvas.height / 2 - 20);
            }
        }

        // Game Loop Utama
        function gameLoop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Trigger Game Over
        function triggerGameOver() {
            isGameOver = true;
            finalScoreText.innerText = `Jarak Tempuh: ${distance} m`;
            gameOverScreen.classList.add('active');
        }

        // Reset Game
        function resetGame() {
            distance = 0;
            currentSpeed = baseSpeed;
            obstacles = [];
            spawnTimer = 0;
            ball.y = groundY - ball.radius;
            ball.dy = 0;
            ball.isGrounded = true;
            
            // Reset state latar belakang
            canvas.style.backgroundColor = `rgb(${skyColors[0].color.join(',')})`;
            scoreText.innerText = `Jarak: 0 m`;
            statusText.innerText = `Waktu: Siang Hari`;
            initBackground();

            isGameOver = false;
            gameStarted = true; // Langsung jalan sehabis tombol ditekan
            gameOverScreen.classList.remove('active');
        }

        // Mulai Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
